# PostgreSQL for local runs and parity. Host port 55432 avoids clashing with a local PostgreSQL.
#   docker compose -f daytrader-go/compose.yaml up -d --wait
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daytrader
      POSTGRES_PASSWORD: daytrader
      POSTGRES_DB: daytrader
    ports:
      - "${DAYTRADER_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daytrader -d daytrader"]
      interval: 2s
      timeout: 3s
      retries: 30
